<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="AURELIA — Where Every Plate Tells a Story. An immersive premium dining experience." />
<title>AURELIA — Where Every Plate Tells a Story</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<!-- React via CDN (single-file, no build step) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<style>
/* ============================================================
   AURELIA — IMMERSIVE DESIGN SYSTEM
   ============================================================ */
:root{
  --sage:#b7c1ac; --sage-deep:#96a086; --sage-soft:#e4e6db;
  --rose:#cf9a90; --rose-deep:#bd8478; --rose-soft:#f0ddd6;
  --cream:#f3ebdd; --peach:#e9d6c2; --peach-soft:#f6e9de;
  --lavender:#c9bfd0; --lavender-soft:#ece6ee; --beige:#e4d8c4;
  --ivory:#faf5ec; --ink:#2f241d; --ink-soft:#7a6a5d;
  --line:#e8ddcc; --white:#fffdf8;
  --shadow-sm:0 4px 16px rgba(70,50,38,.06);
  --shadow-md:0 14px 38px rgba(70,50,38,.10);
  --shadow-lg:0 30px 66px rgba(70,50,38,.16);
  --shadow-xl:0 50px 100px rgba(50,34,26,.28);
  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:34px;
  --serif:'Cormorant Garamond', Georgia, serif;
  --serif-alt:'Cormorant Garamond', Georgia, serif;
  --serif-body:'Playfair Display', Georgia, serif;
  --sans:'Inter', system-ui, -apple-system, sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--sans);color:var(--ink);background:var(--ivory);
  line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;color:var(--ink);line-height:1.05;margin:0;letter-spacing:.005em}
:focus-visible{outline:2.5px solid var(--rose-deep);outline-offset:3px;border-radius:6px}

.container{max-width:1240px;margin:0 auto;padding:0 24px}
.section{padding:100px 0;position:relative}
.eyebrow{font-family:var(--sans);font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--rose-deep);font-weight:600;margin-bottom:14px}
.h-xl{font-size:clamp(2.6rem,6vw,5rem);font-weight:500}
.h-lg{font-size:clamp(2.1rem,4.6vw,3.6rem);font-weight:500}
.h-mega{font-size:clamp(3rem,11vw,10rem);font-weight:600;line-height:.92;letter-spacing:-.01em}
.lead{font-family:var(--sans);font-size:clamp(1rem,1.6vw,1.12rem);color:var(--ink-soft);font-weight:400;line-height:1.7}

/* photos crisp when scaled */
img{image-rendering:auto;backface-visibility:hidden}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;gap:9px;padding:15px 32px;border-radius:100px;font-weight:500;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-family:var(--sans);transition:transform .5s var(--ease-out),box-shadow .4s var(--ease),background .35s var(--ease),color .35s var(--ease);will-change:transform}
.btn-primary{background:var(--ink);color:var(--cream)}
.btn-primary:hover{box-shadow:var(--shadow-md);background:#43342a}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid rgba(47,36,29,.4)}
.btn-ghost:hover{background:var(--ink);color:var(--cream)}
.btn-sage{background:var(--rose);color:#fff}
.btn-sage:hover{box-shadow:var(--shadow-md);background:var(--rose-deep)}
.btn-block{width:100%;justify-content:center}
.btn-light{background:rgba(255,253,248,.92);color:var(--ink)}
.btn-light:hover{background:#fff}

.reveal{opacity:0;transform:translateY(42px);transition:opacity 1s var(--ease-out),transform 1s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.reveal-d1{transition-delay:.08s}.reveal-d2{transition-delay:.16s}.reveal-d3{transition-delay:.24s}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;font-size:.72rem;font-weight:600;letter-spacing:.04em}
.veg-dot{width:16px;height:16px;border:2px solid;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.veg-dot i{width:7px;height:7px;border-radius:50%;display:block}
.veg .veg-dot{border-color:#5a8a4a}.veg .veg-dot i{background:#5a8a4a}
.nonveg .veg-dot{border-color:#b5544a}.nonveg .veg-dot i{background:#b5544a}
.stars{color:#d8a94a;letter-spacing:1px;font-size:.85rem}
/* custom cursor removed — using the native cursor */

/* ===== PARTICLES / AMBIENT MOVEMENT ===== */
.particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(207,154,144,.25));opacity:.5;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(110vh) translateX(0) scale(.6);opacity:0}10%{opacity:.5}90%{opacity:.4}100%{transform:translateY(-10vh) translateX(40px) scale(1);opacity:0}}

/* ===== NAVBAR ===== */
.nav{position:fixed;top:0;left:0;right:0;z-index:900;transition:all .5s var(--ease)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:24px;max-width:1320px;margin:0 auto;transition:padding .5s var(--ease)}
.nav.scrolled{background:rgba(251,247,239,.82);backdrop-filter:blur(16px);box-shadow:0 6px 30px rgba(90,66,52,.08)}
.nav.scrolled .nav-inner{padding:13px 24px}
.nav.on-dark:not(.scrolled) .brand,.nav.on-dark:not(.scrolled) .nav-links a{color:var(--cream)}
.nav.on-dark:not(.scrolled) .icon-btn{background:rgba(255,253,248,.16);color:var(--cream)}
.brand{font-family:var(--serif);font-size:1.75rem;font-weight:800;letter-spacing:.16em;color:var(--ink);transition:font-size .5s var(--ease),color .5s var(--ease)}
.nav.scrolled .brand{font-size:1.45rem}
.nav-links{display:flex;gap:30px;align-items:center}
.nav-links a{font-size:.9rem;font-weight:500;color:var(--ink);position:relative;padding:4px 0;transition:color .3s}
.nav-links a::after{content:"";position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--rose);transition:width .35s var(--ease)}
.nav-links a:hover::after{width:100%}
.nav-actions{display:flex;align-items:center;gap:14px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(232,221,201,.55);transition:all .35s var(--ease);position:relative;color:var(--ink)}
.icon-btn:hover{background:var(--sage-soft);transform:translateY(-2px)}
.cart-count{position:absolute;top:-4px;right:-4px;background:var(--rose);color:#fff;font-size:.68rem;font-weight:700;min-width:20px;height:20px;border-radius:100px;display:flex;align-items:center;justify-content:center;padding:0 5px;animation:pop .35s var(--ease)}
.cart-count.bump{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.hamburger{display:none;flex-direction:column;gap:5px;width:44px;height:44px;align-items:center;justify-content:center;border-radius:50%;background:rgba(232,221,201,.55)}
.hamburger span{width:22px;height:2px;background:var(--ink);border-radius:2px;transition:all .35s var(--ease)}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{position:fixed;inset:0;z-index:899;background:var(--ivory);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;transform:translateY(-100%);transition:transform .55s var(--ease);padding:80px 24px}
.mobile-menu.open{transform:none}
.mobile-menu a{font-family:var(--serif);font-size:2.1rem;color:var(--ink);padding:10px;opacity:0;transform:translateY(20px);transition:all .5s var(--ease)}
.mobile-menu.open a{opacity:1;transform:none}
.mobile-menu.open a:nth-child(1){transition-delay:.1s}.mobile-menu.open a:nth-child(2){transition-delay:.16s}
.mobile-menu.open a:nth-child(3){transition-delay:.22s}.mobile-menu.open a:nth-child(4){transition-delay:.28s}
.mobile-menu.open a:nth-child(5){transition-delay:.34s}.mobile-menu.open a:nth-child(6){transition-delay:.4s}
/* ===== IMMERSIVE HERO ===== */
.hero{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;background:#221a14;color:var(--cream);perspective:1200px}
.hero-layer{position:absolute;inset:-8% -8% -8% -8%;will-change:transform}
.hero-bg{background-size:cover;background-position:center;filter:none;animation:heroZoom 22s ease-in-out infinite alternate}
@keyframes heroZoom{0%{transform:scale(1.04)}100%{transform:scale(1.12)}}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,16,12,.72) 0%,rgba(24,16,12,.42) 42%,rgba(24,16,12,.12) 100%),linear-gradient(0deg,rgba(24,16,12,.6),transparent 55%)}
.hero-inner{position:relative;z-index:5;width:100%;max-width:1320px;margin:0 auto;padding:120px 24px 90px;transform-style:preserve-3d}
.hero-eyebrow{letter-spacing:.4em;font-size:.72rem;text-transform:uppercase;color:var(--peach);font-weight:600;margin-bottom:20px}
.hero-brand{font-family:var(--serif);font-weight:600;font-size:clamp(3.4rem,12vw,10.5rem);line-height:.9;letter-spacing:.01em;margin:0;max-width:100%;overflow-wrap:normal;white-space:nowrap;color:#f7ecdd;background:linear-gradient(180deg,#fff8ec 0%,#f0dcc4 55%,#e2c39c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 10px 40px rgba(20,12,8,.45)}
.hero-tag{font-family:var(--serif-alt);font-style:italic;font-size:clamp(1.5rem,3.4vw,2.8rem);color:var(--peach-soft);margin-top:6px;max-width:640px}
.hero-food{position:absolute;right:5%;bottom:2%;width:min(320px,34vw);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:var(--shadow-xl);z-index:4;will-change:transform}
.hero-food img{width:100%;height:100%;object-fit:cover}
.hero-ing{position:absolute;font-family:var(--serif);font-style:italic;color:rgba(246,233,222,.5);font-size:clamp(1rem,1.6vw,1.5rem);z-index:3;will-change:transform;pointer-events:none}
.hero-cta{display:inline-flex;align-items:center;gap:12px;margin-top:44px;color:var(--cream);font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600}
.hero-cta .arrow{width:44px;height:44px;border-radius:50%;border:1px solid rgba(246,233,222,.5);display:flex;align-items:center;justify-content:center;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.hero-scrollbar{position:absolute;left:24px;bottom:34px;z-index:5;display:flex;align-items:center;gap:12px;color:rgba(246,233,222,.7);font-size:.62rem;letter-spacing:.26em;font-weight:600}
.hero-scrollbar i{display:block;width:70px;height:1px;background:rgba(246,233,222,.4);position:relative;overflow:hidden}
.hero-scrollbar i::after{content:"";position:absolute;left:0;top:0;height:100%;width:30%;background:var(--peach);animation:track 2.4s var(--ease) infinite}
@keyframes track{0%{left:-30%}100%{left:100%}}

/* ===== TASTE · CRAVE · REPEAT marquee ===== */
.marquee{background:var(--ink);color:var(--cream);overflow:hidden;padding:22px 0;position:relative;white-space:nowrap}
.marquee-track{display:inline-flex;align-items:center;gap:0;animation:marq 22s linear infinite;will-change:transform}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-word{font-family:var(--serif);font-size:clamp(1.6rem,3.4vw,2.8rem);font-weight:600;letter-spacing:.02em;padding:0 26px;display:inline-flex;align-items:center;gap:26px}
.marquee-word.outline{color:transparent;-webkit-text-stroke:1px var(--peach);text-stroke:1px var(--peach)}
.marquee-star{color:var(--rose);font-size:1rem}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ===== ONE DISH ONE STORY (compact) ===== */
.story-dish{position:relative;background:linear-gradient(180deg,var(--ivory),var(--cream));overflow:hidden}
/* cinematic bridge so the hero doesn't jump straight into a flat section */
.story-dish::before{content:"";position:absolute;top:0;left:0;right:0;height:160px;background:linear-gradient(180deg,rgba(24,16,12,.5),transparent);pointer-events:none;z-index:0}
.story-dish .container{position:relative;z-index:1}
.sd-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.sd-title{font-family:var(--serif);font-size:clamp(2.4rem,6vw,4.6rem);font-weight:600;line-height:.95;margin-bottom:18px}
.sd-ings{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.sd-tag{font-family:var(--serif);font-style:italic;color:var(--rose-deep);border:1px solid var(--rose-soft);border-radius:100px;padding:5px 14px;font-size:.95rem}
.sd-visual{display:flex;justify-content:center}
.sd-plate{position:relative;width:min(280px,70vw);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:var(--shadow-lg);cursor:pointer;transition:transform .6s var(--ease-out)}
.sd-plate:hover{transform:scale(1.03)}
.sd-plate img{width:100%;height:100%;object-fit:cover}
.sd-price{font-family:var(--serif);font-size:2.2rem;color:var(--rose-deep);font-weight:700}

/* ===== FOOD JOURNEY (horizontal menu) ===== */
.journey{background:var(--ivory);overflow:hidden}
.journey-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.cat-bar{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-pill{white-space:nowrap;padding:11px 22px;border-radius:100px;background:transparent;border:1.5px solid var(--line);font-weight:600;font-size:.82rem;letter-spacing:.06em;color:var(--ink-soft);transition:all .35s var(--ease)}
.cat-pill:hover{border-color:var(--rose);color:var(--ink)}
.cat-pill.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.journey-viewport{overflow:hidden;padding:16px 0}
.journey-track{display:flex;transition:transform .6s var(--ease-out);will-change:transform}
.jpage{flex:0 0 100%;display:grid;gap:24px;align-items:stretch}
/* compact dish card — 4 visible per page */
.jcard{display:flex;flex-direction:column;background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);border:1px solid var(--line);overflow:hidden;height:100%;transition:transform .35s var(--ease-out),box-shadow .4s}
.jcard:hover{box-shadow:var(--shadow-md)}
.jcard-photo{position:relative;aspect-ratio:4/3;overflow:hidden;cursor:pointer;background:var(--cream)}
.jcard-photo img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease-out)}
.jcard:hover .jcard-photo img{transform:scale(1.08)}
.jcard-disc{position:absolute;top:12px;left:12px}
.jcard-fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,253,248,.9);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:all .3s}
.jcard-fav.on{background:var(--rose);color:#fff}
.jcard-body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.jcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.jcard-name{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.1}
.jcard-desc{font-size:.85rem;color:var(--ink-soft);margin:0 0 14px;flex:1}
.jcard-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.jcard-price{font-family:var(--serif);font-size:1.35rem;font-weight:700;color:var(--rose-deep)}
.jcard-price s{font-size:.8rem;color:var(--ink-soft);font-weight:400;margin-left:6px;font-family:var(--sans)}
.dish-disc{background:var(--rose);color:#fff}
.journey-dots{display:flex;gap:8px;justify-content:center;margin-top:22px}
.journey-nav{display:flex;gap:12px;align-items:center}
.jnav{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--ink);transition:all .35s var(--ease);box-shadow:var(--shadow-sm)}
.jnav:hover:not(:disabled){background:var(--ink);color:var(--cream);transform:translateY(-2px)}
.jnav:disabled{opacity:.3;cursor:not-allowed}
.jcount{font-family:var(--serif);font-size:1.1rem;color:var(--ink-soft);min-width:64px;text-align:center}
/* ===== TILT CARD ===== */
.tilt-card{transform-style:preserve-3d;transition:transform .35s var(--ease-out),box-shadow .4s var(--ease);will-change:transform}
.tilt-layer{transform:translateZ(40px)}

/* ===== INGREDIENT UNIVERSE ===== */
.universe{position:relative;background:radial-gradient(120% 90% at 50% 0%,var(--lavender-soft),var(--ivory) 60%);overflow:hidden}
.uni-stage{position:relative;min-height:640px;display:flex;align-items:center;justify-content:center}
.uni-orb{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,253,248,.7);backdrop-filter:blur(4px);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-family:var(--serif);font-size:clamp(.85rem,1.4vw,1.15rem);font-weight:600;color:var(--ink);cursor:pointer;transition:transform .5s var(--ease-out),background .35s,color .35s,box-shadow .4s;will-change:transform;text-align:center;padding:8px;line-height:1.1}
.uni-orb:hover{background:var(--rose);color:#fff;box-shadow:var(--shadow-md);z-index:5}
.uni-orb.on{background:var(--ink);color:var(--cream);box-shadow:var(--shadow-lg)}
.uni-center{position:relative;z-index:3;width:min(320px,74vw);text-align:center;background:radial-gradient(closest-side,var(--ivory) 62%,transparent);padding:14px 10px 18px;border-radius:24px}
.uni-plate{width:min(220px,54vw);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:var(--shadow-lg);margin:0 auto 18px;position:relative}
.uni-plate img{width:100%;height:100%;object-fit:cover;animation:fade .8s var(--ease)}
.uni-line{font-family:var(--serif);font-size:1.7rem;font-weight:600;color:var(--ink)}
.uni-price{color:var(--rose-deep);font-family:var(--serif);font-size:1.5rem;font-weight:700;margin-top:2px}
.uni-hint{color:var(--ink-soft);font-size:.86rem;margin:14px 0 0}

/* ===== STEP INSIDE (restaurant world) ===== */
.world{position:relative;min-height:80vh;overflow:hidden;background:#1c1410;color:var(--cream);display:flex;align-items:center}
.world-layer{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:none;will-change:transform}
.world-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(24,16,12,.82),rgba(24,16,12,.4))}
.world-inner{position:relative;z-index:4;width:100%;max-width:1320px;margin:0 auto;padding:120px 24px}
.world-title{font-family:var(--serif);font-weight:600;font-size:clamp(2.6rem,9vw,8rem);line-height:.9;color:#f7ecdd;text-shadow:0 8px 34px rgba(18,10,6,.55)}
.world-hotspot{position:absolute;z-index:5;transform:translate(-50%,-50%)}
.hs-dot{width:22px;height:22px;border-radius:50%;background:var(--peach);box-shadow:0 0 0 0 rgba(233,214,194,.6);animation:pulse 2.2s infinite;cursor:pointer;position:relative}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(233,214,194,.55)}100%{box-shadow:0 0 0 22px rgba(233,214,194,0)}}
.hs-label{position:absolute;left:32px;top:50%;transform:translateY(-50%);white-space:nowrap;background:rgba(28,20,16,.75);backdrop-filter:blur(6px);padding:9px 16px;border-radius:100px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--cream);opacity:0;transition:opacity .35s,transform .35s}
.world-hotspot:hover .hs-label,.world-hotspot.on .hs-label{opacity:1;transform:translateY(-50%) translateX(4px)}
.world-card{position:absolute;right:6%;bottom:10%;z-index:6;max-width:360px;background:rgba(251,247,239,.95);color:var(--ink);border-radius:var(--r-lg);padding:26px 28px;box-shadow:var(--shadow-xl);animation:modalIn .5s var(--ease-out)}

/* ===== AMBIENCE STRIP ===== */
.amb{background:var(--cream)}
.amb-track{display:flex;gap:22px;overflow-x:auto;padding:10px 4px 24px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.amb-track::-webkit-scrollbar{display:none}
.amb-slide{min-width:min(420px,84vw);scroll-snap-align:center;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);position:relative;background:var(--cream)}
.amb-media{aspect-ratio:16/10;width:100%;overflow:hidden}
.amb-media img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease-out)}
.amb-slide:hover .amb-media img{transform:scale(1.06)}
.amb-cap{position:absolute;left:0;right:0;bottom:0;padding:22px;background:linear-gradient(180deg,transparent,rgba(40,28,22,.82));color:var(--cream)}
.amb-ctrls{display:flex;gap:12px;justify-content:center;margin-top:8px}

/* ===== EDITORIAL CHEF ===== */
.chef2{position:relative;background:var(--peach-soft);overflow:hidden}
.chef2-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:0;align-items:stretch;min-height:78vh}
.chef2-photo{position:relative;overflow:hidden;border-radius:var(--r-xl);box-shadow:var(--shadow-lg)}
.chef2-photo img{width:100%;height:100%;object-fit:cover;min-height:520px;will-change:transform}
.chef2-name{position:absolute;left:-2%;bottom:6%;font-family:var(--serif);font-size:clamp(2.4rem,6vw,5rem);font-weight:600;color:var(--cream);text-shadow:0 8px 30px rgba(30,20,14,.5);z-index:3;pointer-events:none}
.chef2-copy{padding:0 0 0 60px;display:flex;flex-direction:column;justify-content:center}
.chef2-stats{display:flex;gap:40px;margin-top:30px;flex-wrap:wrap}
.chef2-stats .stat b{font-family:var(--serif);font-size:3rem;font-weight:600;color:var(--rose-deep);display:block;line-height:1}
.chef2-stats .stat span{font-size:.82rem;color:var(--ink-soft)}

/* ===== OFFERS ORBIT ===== */
.offers2{position:relative;background:radial-gradient(120% 90% at 50% 30%,var(--rose-soft),var(--peach-soft) 65%);overflow:hidden}
.orbit-stage{position:relative;min-height:560px;display:flex;align-items:center;justify-content:center}
.orbit-center{position:relative;z-index:3;width:min(240px,56vw);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:var(--shadow-lg)}
.orbit-center img{width:100%;height:100%;object-fit:cover;animation:slowspin 40s linear infinite}
@keyframes slowspin{to{transform:rotate(360deg)}}
.orbit-item{position:absolute;z-index:4;background:var(--white);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-md);text-align:center;width:190px;transition:transform .5s var(--ease-out),box-shadow .4s;will-change:transform;cursor:pointer}
.orbit-item:hover{transform:scale(1.08) translateZ(0);box-shadow:var(--shadow-lg);z-index:6}
.orbit-big{font-family:var(--serif);font-size:1.9rem;font-weight:700;margin:2px 0}
.orbit-code{display:inline-block;border:1px dashed var(--rose-deep);color:var(--rose-deep);padding:5px 12px;border-radius:8px;font-weight:600;letter-spacing:.12em;margin-top:8px;font-size:.78rem}
/* ===== FULL-SCREEN TESTIMONIALS ===== */
.testi2{position:relative;min-height:72vh;overflow:hidden;display:flex;align-items:center;color:var(--cream);background:#241a14;padding:80px 0}
.testi2-bg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:none;opacity:0;transition:opacity 1.1s var(--ease);transform:scale(1.1);animation:heroZoom 24s ease-in-out infinite alternate}
.testi2-bg.on{opacity:.5}
.testi2-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(28,20,15,.82),rgba(28,20,15,.5))}
.testi2-inner{position:relative;z-index:3;max-width:1000px;margin:0 auto;padding:0 24px;text-align:center}
.testi2-head{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,3.6rem);line-height:1.02;color:#f7ecdd;margin:8px 0 18px;text-shadow:0 8px 30px rgba(18,10,6,.5)}
.testi2-mark{font-family:var(--serif);font-size:clamp(4rem,11vw,8rem);line-height:.6;color:var(--peach);opacity:.5;height:.4em}
.testi2-quote{font-family:var(--serif-alt);font-style:italic;font-size:clamp(1.7rem,4.2vw,3.4rem);line-height:1.28;min-height:2.4em;transition:opacity .6s var(--ease),transform .6s var(--ease-out)}
.testi2-name{margin-top:22px;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;font-weight:600;color:var(--peach-soft)}
.testi2-dots{display:flex;gap:10px;justify-content:center;margin-top:30px}
.testi2-dot{width:9px;height:9px;border-radius:50%;background:rgba(246,233,222,.35);cursor:pointer;transition:all .3s}
.testi2-dot.on{background:var(--peach);width:28px;border-radius:100px}

/* ===== GALLERY COLLAGE ===== */
.collage{position:relative;background:var(--white)}
.collage-grid{position:relative;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:52px;gap:12px;max-width:960px;margin:0 auto}
.col-item{position:relative;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .6s var(--ease-out),box-shadow .5s,z-index 0s;will-change:transform}
.col-item img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease-out)}
.collage:hover .col-item{opacity:.72;transform:scale(.97)}
.collage .col-item:hover{opacity:1;transform:scale(1.05);box-shadow:var(--shadow-xl);z-index:5}
.col-item:hover img{transform:scale(1.08)}
.col-ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(40,28,22,.8));display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:var(--cream);opacity:0;transition:opacity .4s}
.col-item:hover .col-ov{opacity:1}
.col-cat{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--peach)}
.round{border-radius:50%}.r-lg{border-radius:var(--r-lg)}.r-xl{border-radius:var(--r-xl)}
.rot-l{transform:rotate(-4deg)}.rot-r{transform:rotate(4deg)}
.collage .col-item.rot-l:hover,.collage .col-item.rot-r:hover{transform:scale(1.05) rotate(0deg)}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:1800;background:rgba(30,22,17,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;animation:fade .3s}
.lb-img{max-width:min(820px,92vw);max-height:78vh;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-xl);background:var(--cream)}
.lb-img img{width:100%;height:100%;object-fit:cover}
.lb-cap{color:var(--cream);margin-top:18px;text-align:center;font-family:var(--serif-alt);font-size:1.3rem}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;background:rgba(246,233,222,.14);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:1.6rem;transition:background .3s}
.lb-nav:hover{background:rgba(246,233,222,.28)}
.lb-prev{left:24px}.lb-next{right:24px}
.lb-close{position:absolute;top:24px;right:24px;width:48px;height:48px;border-radius:50%;background:rgba(246,233,222,.14);color:var(--cream);font-size:1.4rem;display:flex;align-items:center;justify-content:center}

/* ===== FLY TO CART ===== */
.fly-img{position:fixed;z-index:4000;width:80px;height:80px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lg);pointer-events:none;will-change:transform,opacity}
.fly-img img{width:100%;height:100%;object-fit:cover}
/* ===== TOAST ===== */
.toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--cream);padding:14px 24px;border-radius:100px;box-shadow:var(--shadow-lg);font-weight:500;font-size:.92rem;display:flex;align-items:center;gap:10px;animation:toastIn .45s var(--ease-out)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.92)}to{opacity:1;transform:none}}

/* ===== MODAL (cinematic detail) ===== */
.overlay{position:fixed;inset:0;background:rgba(40,28,22,.6);backdrop-filter:blur(8px);z-index:1500;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.modal{background:var(--ivory);border-radius:var(--r-xl);max-width:960px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow-xl);animation:modalPop .5s var(--ease-out)}
@keyframes modalPop{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
.modal-grid{display:grid;grid-template-columns:1.05fr .95fr}
.modal-img{aspect-ratio:1;background:var(--cream);overflow:hidden}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:38px}
.modal-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:var(--shadow-sm)}
.spec{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.spec div{font-size:.85rem}
.spec b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tag{background:var(--sage-soft);color:var(--ink);padding:5px 12px;border-radius:100px;font-size:.78rem;font-weight:500}
.qty{display:flex;align-items:center;background:var(--rose-soft);border-radius:100px;overflow:hidden}
.qty button{width:36px;height:36px;font-size:1.1rem;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .2s}
.qty button:hover{background:var(--rose)}
.qty span{min-width:28px;text-align:center;font-weight:700}
.add-btn{padding:11px 20px;border-radius:100px;background:transparent;border:1px solid var(--rose);color:var(--rose-deep);font-weight:600;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;transition:all .3s var(--ease);display:inline-flex;align-items:center;gap:6px}
.add-btn:hover{background:var(--rose);color:#fff}

/* ===== CART DRAWER (Your Table) ===== */
.drawer-ov{position:fixed;inset:0;background:rgba(40,28,22,.5);backdrop-filter:blur(5px);z-index:1600;animation:fade .3s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--ivory);z-index:1601;box-shadow:var(--shadow-xl);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .5s var(--ease-out)}
.drawer.open{transform:none}
.drawer-head{padding:26px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line);background:var(--white)}
.drawer-head .eyebrow{margin:0}
.drawer-body{flex:1;overflow-y:auto;padding:14px 24px}
.cart-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px dashed var(--line)}
.cart-thumb{width:76px;height:76px;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--cream)}
.cart-thumb img{width:100%;height:100%;object-fit:cover}
.sum-thumb{width:38px;height:38px;border-radius:9px;overflow:hidden;flex-shrink:0;background:var(--cream);display:block}
.sum-thumb img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-remove{color:var(--ink-soft);font-size:.8rem;text-decoration:underline;margin-top:4px}
.drawer-foot{padding:22px 24px;border-top:1px dashed var(--line);background:var(--white)}
.sum-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:.92rem;color:var(--ink-soft)}
.sum-total{display:flex;justify-content:space-between;font-family:var(--serif);font-size:1.5rem;font-weight:700;color:var(--ink);margin:12px 0 18px;padding-top:12px;border-top:1px solid var(--line)}
.cart-empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
/* ===== FORMS / CHECKOUT ===== */
.field{margin-bottom:16px}
.field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input,.field select,.field textarea{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:.92rem;background:var(--white);color:var(--ink);transition:border-color .3s,box-shadow .3s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose);outline:none;box-shadow:0 0 0 4px var(--rose-soft)}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-opt{flex:1;min-width:110px;border:1.5px solid var(--line);border-radius:12px;padding:13px;text-align:center;font-weight:600;font-size:.88rem;cursor:pointer;transition:all .3s;background:var(--white)}
.radio-opt.on{border-color:var(--rose-deep);background:var(--rose-soft)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.checkout{position:relative;overflow:hidden;min-height:100vh;padding-top:120px}
.checkout-bg{position:absolute;inset:0;z-index:0;background:linear-gradient(120deg,var(--peach-soft),var(--lavender-soft),var(--sage-soft),var(--peach-soft));background-size:300% 300%;animation:gmove 18s ease infinite}
@keyframes gmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.checkout-inner{position:relative;z-index:1}
.checkout-grid{display:grid;grid-template-columns:1.3fr .9fr;gap:40px}
.checkout-summary{background:var(--white);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow-md);height:fit-content;position:sticky;top:100px}
.card-panel{background:rgba(255,253,248,.9);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow-sm);margin-bottom:24px}
.pay-anim{text-align:center;padding:40px}
.spinner{width:64px;height:64px;border:5px solid var(--rose-soft);border-top-color:var(--rose-deep);border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.check-anim{width:88px;height:88px;border-radius:50%;background:var(--sage-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pop .55s var(--ease-out)}
.check-anim svg{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .25s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.confirm-ring{position:relative;width:140px;height:140px;margin:0 auto 8px}
.confirm-ring span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--rose-soft);animation:ripple 2.4s var(--ease) infinite}
.confirm-ring span:nth-child(2){animation-delay:.8s}.confirm-ring span:nth-child(3){animation-delay:1.6s}
@keyframes ripple{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.5);opacity:0}}

/* ===== CONTACT / FOOTER ===== */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.map-box{border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);min-height:340px;background:linear-gradient(135deg,var(--sage-soft),var(--lavender-soft));position:relative;display:flex;align-items:center;justify-content:center}
.map-pin{width:22px;height:22px;background:var(--rose);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 0 8px rgba(216,167,163,.3)}
.info-row{display:flex;gap:14px;margin-bottom:20px;align-items:flex-start}
.info-ic{width:44px;height:44px;border-radius:12px;background:var(--rose-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--rose-deep)}
.contact-btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.footer{background:var(--ink);color:var(--cream);padding:70px 0 30px}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.3fr;gap:36px;margin-bottom:40px}
.footer h4{color:var(--cream);font-size:1.05rem;margin-bottom:16px}
.footer a,.footer p{color:rgba(247,241,230,.72);font-size:.9rem;margin:8px 0;transition:color .3s}
.footer a:hover{color:var(--peach)}
.foot-brand{font-family:var(--serif);font-size:2rem;font-weight:800;letter-spacing:.12em;color:var(--cream)}
.news-form{display:flex;gap:8px;margin-top:14px}
.news-form input{flex:1;padding:12px 14px;border-radius:100px;border:none;font-family:inherit;background:rgba(247,241,230,.1);color:var(--cream)}
.news-form input::placeholder{color:rgba(247,241,230,.5)}
.social{display:flex;gap:12px;margin-top:16px}
.social a{width:40px;height:40px;border-radius:50%;background:rgba(247,241,230,.1);display:flex;align-items:center;justify-content:center;color:var(--cream)}
.social a:hover{background:var(--sage-deep)}
.copyright{text-align:center;padding-top:26px;border-top:1px solid rgba(247,241,230,.15);color:rgba(247,241,230,.6);font-size:.85rem}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--beige);border-radius:10px;border:3px solid var(--ivory)}
::-webkit-scrollbar-track{background:var(--ivory)}
/* ===== RESPONSIVE ===== */
@media(max-width:1080px){
  .sd-grid{grid-template-columns:1fr;gap:28px}
  .sd-visual{order:-1}
  .chef2-grid{grid-template-columns:1fr}
  .chef2-copy{padding:36px 0 0}
}
@media(max-width:960px){
  .nav-links{display:none}
  .hamburger{display:flex}
  .contact-grid,.checkout-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
  .checkout-summary{position:static}
  .section{padding:70px 0}
  .collage-grid{grid-auto-rows:46px}
  .hero-food{width:min(300px,50vw);right:2%;bottom:2%}
}
@media(max-width:640px){
  .container{padding:0 18px}
  .modal-grid{grid-template-columns:1fr}
  .modal-img{aspect-ratio:16/11}
  .modal-body{padding:24px}
  .form-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr}
  .drawer{width:100%}
  .hero-food{position:relative;right:auto;bottom:auto;margin:32px auto 0;width:min(260px,70vw)}
  .hero-inner{padding:116px 20px 56px;text-align:left}
  .hero-brand{font-size:clamp(3rem,15vw,5rem)}
  .marquee-word{font-size:1.5rem;padding:0 16px;gap:16px}
  .amb-slide{min-width:88vw}
  .testi2-head{font-size:clamp(1.7rem,7vw,2.4rem)}
  .collage-grid{grid-template-columns:repeat(6,1fr);grid-auto-rows:44px}
  .world-card{position:static;max-width:none;margin-top:24px}
  .chef2-photo img{min-height:380px}
}
@media(max-width:480px){
  .nav-inner{padding:16px}
  .nav.scrolled .nav-inner{padding:11px 16px}
  .brand{font-size:1.42rem}
  .nav-actions{gap:9px}
  .nav-actions .btn.btn-primary{padding:9px 14px;font-size:.6rem;letter-spacing:.08em}
  .section{padding:56px 0}
  .journey-head{gap:12px}
  .dish-num{font-size:2.6rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.15s!important;scroll-behavior:auto!important}
  .hero-bg,.orbit-center img,.testi2-bg{animation:none!important}
}

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useContext, createContext, useCallback, useLayoutEffect } = React;

const PAL = {

  peach:'#e9d6c2', lavender:'#c9bfd0', beige:'#e4d8c4', ivory:'#faf5ec',
  ink:'#2f241d', olive:'#8a8f66', berry:'#b07068', gold:'#d3a24e'
};

/* ============================================================
   DATA LAYER (preserved from original)
   ============================================================ */
const CATEGORIES = ["All","Starters","Soups","Main Course","Pasta","Pizza","Desserts","Beverages","Chef Specials"];

const MENU = [

/* ============================================================
   INTERACTION HOOKS
   ============================================================ */
const isTouch = ()=> (typeof window!=="undefined") && (window.matchMedia("(hover:none)").matches || "ontouchstart" in window);
const reduceMotion = ()=> (typeof window!=="undefined") && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

/* Global normalized mouse position (-1..1) */
function useMouse(){
  const ref = useRef({x:0,y:0});
  useEffect(()=>{
    if(isTouch()) return;
    const on=(e)=>{ ref.current={ x:(e.clientX/window.innerWidth-0.5)*2, y:(e.clientY/window.innerHeight-0.5)*2 }; };
    window.addEventListener("mousemove",on,{passive:true});
    return ()=>window.removeEventListener("mousemove",on);
  },[]);
  return ref;
}

/* Scroll progress of an element through the viewport: 0 (entering) -> 1 (leaving) */
function useScrollProgress(ref){
  const [p,setP] = useState(0);
  useEffect(()=>{
    let raf=0;
    const calc=()=>{
      const el=ref.current; if(!el) return;
      const r=el.getBoundingClientRect();
      const vh=window.innerHeight;
      const total=r.height+vh;
      const prog=clamp((vh-r.top)/total,0,1);
      setP(prog);
    };
    const on=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(calc); };
    calc();
    window.addEventListener("scroll",on,{passive:true});
    window.addEventListener("resize",on);
    return ()=>{ window.removeEventListener("scroll",on); window.removeEventListener("resize",on); cancelAnimationFrame(raf); };
  },[ref]);
  return p;
}

/* Reveal-on-scroll */
function useReveal(){
  useEffect(()=>{
    const els=document.querySelectorAll(".reveal:not(.in)");
    const io=new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
    },{threshold:0.12});
    els.forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  });
}

/* 3D tilt on hover following cursor */
function TiltCard({children,className="",max=10,style,onClick}){
  const ref=useRef(null);
  const onMove=(e)=>{
    if(isTouch()||reduceMotion()) return;
    const el=ref.current; if(!el) return;
    const r=el.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width-0.5;
    const py=(e.clientY-r.top)/r.height-0.5;
    el.style.transform=`perspective(900px) rotateY(${px*max}deg) rotateX(${-py*max}deg) translateZ(0)`;
  };
  const reset=()=>{ const el=ref.current; if(el) el.style.transform="perspective(900px) rotateY(0) rotateX(0)"; };
  return <div ref={ref} className={"tilt-card "+className} style={style} onMouseMove={onMove} onMouseLeave={reset} onClick={onClick}>{children}</div>;
}

/* Magnetic button — subtle pull toward cursor */
function Magnetic({children,className="",strength=0.35,...rest}){
  const ref=useRef(null);
  const onMove=(e)=>{
    if(isTouch()||reduceMotion()) return;
    const el=ref.current; if(!el) return;
    const r=el.getBoundingClientRect();
    const x=(e.clientX-(r.left+r.width/2))*strength;
    const y=(e.clientY-(r.top+r.height/2))*strength;
    el.style.transform=`translate(${x}px,${y}px)`;
  };
  const reset=()=>{ const el=ref.current; if(el) el.style.transform="translate(0,0)"; };
  return <button ref={ref} className={className} onMouseMove={onMove} onMouseLeave={reset} {...rest}>{children}</button>;
}

/* Custom cursor */
function CustomCursor(){
  const dot=useRef(null), ring=useRef(null);
  useEffect(()=>{
    if(isTouch()){ return; }
    document.body.classList.add("cursor-on");
    let dx=0,dy=0,rx=0,ry=0,mx=0,my=0,raf=0;
    const move=(e)=>{ mx=e.clientX; my=e.clientY; if(dot.current){dot.current.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`;} };
    const loop=()=>{ rx+=(mx-rx)*0.18; ry+=(my-ry)*0.18; if(ring.current) ring.current.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`; raf=requestAnimationFrame(loop); };
    const over=(e)=>{
      const t=e.target.closest("[data-cursor],a,button");
      if(!t||!ring.current) return;
      const label=t.getAttribute("data-cursor");
      ring.current.classList.add("hover");
      if(label){ ring.current.classList.add("label"); ring.current.setAttribute("data-label",label); }
    };
    const out=(e)=>{
      const t=e.target.closest("[data-cursor],a,button");
      if(!t||!ring.current) return;
      ring.current.classList.remove("hover","label");
      ring.current.removeAttribute("data-label");
    };
    window.addEventListener("mousemove",move,{passive:true});
    document.addEventListener("mouseover",over);
    document.addEventListener("mouseout",out);
    raf=requestAnimationFrame(loop);
    return ()=>{ document.body.classList.remove("cursor-on"); window.removeEventListener("mousemove",move); document.removeEventListener("mouseover",over); document.removeEventListener("mouseout",out); cancelAnimationFrame(raf); };
  },[]);
  if(typeof window!=="undefined" && isTouch()) return null;
  return (<><div className="cursor-ring" ref={ring} aria-hidden="true"></div><div className="cursor-dot" ref={dot} aria-hidden="true"></div></>);
}

function Particles(){

}

   STORE — Cart + Toast (localStorage persisted) — logic preserved
   ============================================================ */
const Store = createContext(null);
const useStore = ()=> useContext(Store);

function StoreProvider({children}){
  const [cart,setCart] = useState(()=>{ try{ return JSON.parse(localStorage.getItem("aurelia_cart")||"[]"); }catch{ return []; } });
  const [favs,setFavs] = useState(()=>{ try{ return JSON.parse(localStorage.getItem("aurelia_favs")||"[]"); }catch{ return []; } });
  const [toasts,setToasts] = useState([]);
  const [drawerOpen,setDrawerOpen] = useState(false);
  const [detailId,setDetailId] = useState(null);
  const [view,setView] = useState("home");
  const [order,setOrder] = useState(null);
  const [appliedCode,setAppliedCode] = useState(null);
  const [flyers,setFlyers] = useState([]);
  const cartIconRef = useRef(null);

  useEffect(()=>{ localStorage.setItem("aurelia_cart",JSON.stringify(cart)); },[cart]);
  useEffect(()=>{ localStorage.setItem("aurelia_favs",JSON.stringify(favs)); },[favs]);

  const toast = useCallback((msg)=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 2600);
  },[]);

  /* fly-to-cart animation from a source rect */
  const flyToCart = useCallback((image, fromRect)=>{
    if(!fromRect || !cartIconRef.current || isTouch() || reduceMotion()) return;
    const target=cartIconRef.current.getBoundingClientRect();
    const id=Date.now()+Math.random();
    setFlyers(f=>[...f,{id,image,from:fromRect,to:target}]);
    setTimeout(()=> setFlyers(f=>f.filter(x=>x.id!==id)), 850);
  },[]);

  const addToCart = useCallback((item,qty=1,fromRect=null)=>{
    setCart(c=>{
      const ex=c.find(x=>x.id===item.id);
      if(ex) return c.map(x=>x.id===item.id?{...x,qty:x.qty+qty}:x);
      return [...c,{id:item.id,name:item.name,price:item.price,type:item.type,image:item.image,qty}];
    });
    flyToCart(item.image, fromRect);
    toast("Added to your table.");
  },[toast,flyToCart]);

  const setQty = useCallback((id,qty)=>{ setCart(c=> qty<=0 ? c.filter(x=>x.id!==id) : c.map(x=>x.id===id?{...x,qty}:x)); },[]);
  const removeItem = useCallback((id)=> setCart(c=>c.filter(x=>x.id!==id)),[]);
  const clearCart = useCallback(()=>{ setCart([]); setAppliedCode(null); },[]);
  const toggleFav = useCallback((id)=> setFavs(f=> f.includes(id)?f.filter(x=>x!==id):[...f,id]),[]);

  const count = useMemo(()=> cart.reduce((s,x)=>s+x.qty,0),[cart]);
  const subtotal = useMemo(()=> cart.reduce((s,x)=>s+x.price*x.qty,0),[cart]);
  const discount = useMemo(()=>{ let d=0; if(appliedCode==="AURELIA20") d+=Math.round(subtotal*0.2); return d; },[subtotal,appliedCode]);
  const deliveryFee = useMemo(()=> subtotal>0 ? (subtotal>=999?0:49) : 0,[subtotal]);
  const total = Math.max(0, subtotal - discount + deliveryFee);

  const applyCode = useCallback((code)=>{
    const c=code.trim().toUpperCase();
    if(c==="AURELIA20"){ setAppliedCode(c); toast("Code AURELIA20 applied — 20% off"); return true; }
    toast("Invalid promo code"); return false;
  },[toast]);

  const value={cart,favs,toasts,drawerOpen,setDrawerOpen,detailId,setDetailId,view,setView,
    order,setOrder,appliedCode,setAppliedCode,applyCode,toast,addToCart,setQty,removeItem,
    clearCart,toggleFav,count,subtotal,discount,deliveryFee,total,flyers,cartIconRef};
  return <Store.Provider value={value}>{children}</Store.Provider>;
}

/* Fly-to-cart layer */
function FlyLayer(){
  const {flyers}=useStore();
  return (
    <>{flyers.map(f=>(<Flyer key={f.id} {...f}/>))}</>
  );
}
function Flyer({image,from,to}){
  const ref=useRef(null);
  useLayoutEffect(()=>{
    const el=ref.current; if(!el) return;
    el.style.left=from.left+"px"; el.style.top=from.top+"px";
    el.style.width=Math.min(from.width,120)+"px"; el.style.height=Math.min(from.height,120)+"px";
    el.style.opacity="1"; el.style.transform="translate(0,0) scale(1)";
    requestAnimationFrame(()=>{
      el.style.transition="transform .8s cubic-bezier(.5,0,.3,1),opacity .8s ease";
      const dx=(to.left+to.width/2)-(from.left+Math.min(from.width,120)/2);
      const dy=(to.top+to.height/2)-(from.top+Math.min(from.height,120)/2);
      el.style.transform=`translate(${dx}px,${dy}px) scale(.15)`;
      el.style.opacity="0.2";
    });
  },[]);
  return <div className="fly-img" ref={ref}><Img src={image}/></div>;
}

function usePerPage(){
  const calc=()=>{ const w=window.innerWidth; if(w<=560) return 1; if(w<=820) return 2; if(w<=1100) return 3; return 4; };
  const [n,setN]=useState(calc);
  useEffect(()=>{ const on=()=>setN(calc()); window.addEventListener("resize",on); return ()=>window.removeEventListener("resize",on); },[]);
  return n;
}

function FoodJourney(){
  const [active,setActive] = useState("All");
  const items = useMemo(()=>{
    if(active==="All") return MENU;
    if(active==="Chef Specials") return MENU.filter(m=>m.chefRecommended);
    return MENU.filter(m=>m.category===active);
  },[active]);
  const perPage = usePerPage();
  const pageCount = Math.max(1, Math.ceil(items.length/perPage));
  const [page,setPage] = useState(0);
  useEffect(()=>{ setPage(0); },[active]);
  useEffect(()=>{ setPage(p=>clamp(p,0,pageCount-1)); },[pageCount]);
  const go=(d)=> setPage(p=>clamp(p+d,0,pageCount-1));
  const trackRef=useRef(null);

  // horizontal swipe (never blocks vertical scroll)
  useEffect(()=>{
    const track=trackRef.current; if(!track) return;
    let down=false,sx=0,sy=0;
    const dn=(e)=>{down=true;sx=e.clientX;sy=e.clientY;};
    const mv=(e)=>{ if(!down)return; const dx=e.clientX-sx,dy=e.clientY-sy; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ go(dx<0?1:-1); down=false; } };
    const up=()=>{down=false;};
    track.addEventListener("pointerdown",dn); window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up);
    return ()=>{ track.removeEventListener("pointerdown",dn); window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); };
  },[pageCount]);

  return (
    <section className="section journey" id="menu">
      <div className="container">
        <div className="journey-head">
          <div className="reveal">
            <p className="eyebrow">The Culinary Journey</p>
            <h2 className="h-lg">Savour the Narrative</h2>
          </div>
          <div className="journey-nav reveal">
            <button className="jnav" aria-label="Previous" disabled={page<=0} onClick={()=>go(-1)}>‹</button>
            <span className="jcount">{pageCount?page+1:0} / {pageCount}</span>
            <button className="jnav" aria-label="Next" disabled={page>=pageCount-1} onClick={()=>go(1)}>›</button>
          </div>
        </div>
        <div className="cat-bar reveal" role="tablist" aria-label="Menu categories">
          {CATEGORIES.map(c=>(<button key={c} role="tab" aria-selected={active===c} className={"cat-pill"+(active===c?" active":"")} onClick={()=>setActive(c)}>{c}</button>))}
        </div>

        {items.length>0 ? (
          <div className="journey-viewport reveal">
            <div className="journey-track" ref={trackRef} style={{transform:`translateX(-${page*100}%)`}}>
              {Array.from({length:pageCount}).map((_,pi)=>(
                <div className="jpage" key={pi} style={{gridTemplateColumns:`repeat(${perPage},1fr)`}} aria-hidden={pi!==page}>
                  {items.slice(pi*perPage,pi*perPage+perPage).map(it=> <JourneyCard key={it.id} it={it}/>)}
                </div>
              ))}
            </div>
          </div>
        ) : (
          <p style={{textAlign:"center",color:"var(--ink-soft)",padding:40}}>No dishes in this category yet.</p>
        )}

        {pageCount>1 && (
          <div className="journey-dots">
            {Array.from({length:pageCount}).map((_,pi)=>(<button key={pi} className={"pager-dot"+(pi===page?" on":"")} aria-label={`Page ${pi+1}`} onClick={()=>setPage(pi)}/>))}
          </div>
        )}
      </div>
    </section>
  );
}

/* ============================================================
   EDITORIAL CHEF
   ============================================================ */
function Counter({to,decimal,suffix}){
  const [val,setVal]=useState(0); const ref=useRef(null); const started=useRef(false);
  useEffect(()=>{
    const io=new IntersectionObserver((es)=>{
      if(es[0].isIntersecting && !started.current){ started.current=true;
        const dur=1400,t0=performance.now();
        const tick=(t)=>{ const pr=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-pr,3); setVal(decimal?+(to*e).toFixed(1):Math.round(to*e)); if(pr<1) requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      }
    },{threshold:0.5});
    if(ref.current) io.observe(ref.current);
    return ()=>io.disconnect();
  },[to,decimal]);
  return <b ref={ref}>{val}{suffix}</b>;
}

function ChefEditorial(){
  const mouse=useMouse(); const imgRef=useRef(null);
  useEffect(()=>{

/* ============================================================
   OFFERS ORBIT
   ============================================================ */
function OffersOrbit(){
  const {applyCode,setDrawerOpen,toast}=useStore();
  const mouse=useMouse(); const refs=useRef([]);
  useEffect(()=>{
    if(reduceMotion()||isTouch()) return;
    let raf=0,t=0;
    const loop=()=>{ t+=0.005; const {x,y}=mouse.current;
      refs.current.forEach((el,i)=>{ if(!el)return; const fx=Math.sin(t+i*2)*12,fy=Math.cos(t*0.8+i*2)*12; el.style.marginLeft=(fx+x*(16+i*4))+"px"; el.style.marginTop=(fy+y*(14+i*3))+"px"; });
      raf=requestAnimationFrame(loop); };
    raf=requestAnimationFrame(loop); return ()=>cancelAnimationFrame(raf);
  },[mouse]);
  const pos=[{top:"8%",left:"18%"},{top:"20%",right:"14%"},{bottom:"12%",left:"30%"}];
  const dish=getItem(6);
  return (
    <section className="section offers2" id="offers">
      <div className="container">
        <div className="reveal" style={{textAlign:"center",marginBottom:10}}>
          <p className="eyebrow" style={{justifyContent:"center"}}>Limited Time</p>
          <h2 className="h-lg">Something Special Awaits</h2>
        </div>
        <div className="orbit-stage">
          <div className="orbit-center"><Img src={dish.image} alt="Signature plating"/></div>
          {OFFERS.map((o,i)=>(
            <div key={o.id} ref={el=>refs.current[i]=el} className="orbit-item" style={pos[i]}
              onClick={()=>{ if(o.code){applyCode(o.code);setDrawerOpen(true);} else toast("Offer applied at checkout"); }} data-cursor="Claim">
              <p className="eyebrow" style={{margin:0,fontSize:".62rem"}}>{o.title}</p>
              <div className="orbit-big" style={{color:o.tone}}>{o.big}</div>
              <p style={{color:"var(--ink-soft)",fontSize:".82rem",margin:0}}>{o.sub}</p>
              {o.code && <span className="orbit-code">{o.code}</span>}
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   GALLERY COLLAGE + LIGHTBOX
   ============================================================ */
/* explicit collage layout: [colStart/colSpan, rowStart/rowSpan, shape] on 12-col grid */
const COLLAGE_LAYOUT = [
  {c:"1 / span 5", r:"1 / span 4", cls:"r-xl rot-l"},
  {c:"6 / span 4", r:"1 / span 3", cls:"round"},
  {c:"10 / span 3", r:"1 / span 3", cls:"r-lg rot-r"},
  {c:"6 / span 3", r:"4 / span 4", cls:"r-lg"},
  {c:"9 / span 4", r:"4 / span 4", cls:"r-xl rot-l"},
  {c:"1 / span 5", r:"5 / span 4", cls:"round"},
  {c:"9 / span 4", r:"8 / span 3", cls:"r-lg rot-r"},
  {c:"1 / span 4", r:"9 / span 3", cls:"r-xl"}
];
function Gallery(){
  const [lb,setLb]=useState(null);
  useEffect(()=>{
    if(lb===null) return;
    const onKey=(e)=>{ if(e.key==="Escape")setLb(null); if(e.key==="ArrowRight")setLb(i=>(i+1)%GALLERY.length); if(e.key==="ArrowLeft")setLb(i=>(i-1+GALLERY.length)%GALLERY.length); };
    document.addEventListener("keydown",onKey);
    return ()=>document.removeEventListener("keydown",onKey);
  },[lb]);
  const cur = lb!==null ? GALLERY[lb] : null;
  return (
    <section className="section collage" id="gallery">
      <div className="container">
        <div className="reveal" style={{marginBottom:26}}>
          <p className="eyebrow">Gallery</p>
          <h2 className="h-lg">A Taste Before You Arrive</h2>
        </div>
        <div className="collage-grid reveal">
          {GALLERY.map((g,idx)=>{
            const L=COLLAGE_LAYOUT[idx]||{c:"auto",r:"span 3",cls:"r-lg"};
            return (
              <button key={g.id} className={"col-item "+L.cls} style={{gridColumn:L.c,gridRow:L.r}} onClick={()=>setLb(idx)} aria-label={`View ${g.title}`} data-cursor="View">
                <Img src={g.image} alt={g.title}/>
                <span className="col-ov"><span className="col-cat">{g.category}</span><strong style={{fontFamily:"var(--serif)",fontSize:"1.05rem"}}>{g.title}</strong></span>
              </button>
            );
          })}
        </div>
      </div>
      {cur && (
        <div className="lightbox" onClick={()=>setLb(null)} role="dialog" aria-modal="true" aria-label={cur.title}>
          <button className="lb-close" aria-label="Close" onClick={(e)=>{e.stopPropagation();setLb(null);}}><Icon name="close"/></button>
          <button className="lb-nav lb-prev" aria-label="Previous" onClick={(e)=>{e.stopPropagation();setLb(i=>(i-1+GALLERY.length)%GALLERY.length);}}>‹</button>
          <div className="lb-img" style={{width:"min(820px,92vw)",aspectRatio:"16/10"}} onClick={e=>e.stopPropagation()}><Img src={cur.image} alt={cur.title}/></div>
          <button className="lb-nav lb-next" aria-label="Next" onClick={(e)=>{e.stopPropagation();setLb(i=>(i+1)%GALLERY.length);}}>›</button>
          <div className="lb-cap">{cur.title} · <span style={{opacity:.7}}>{cur.category}</span></div>
        </div>
      )}
    </section>
  );
}

          <h2 className="h-lg" style={{margin:"6px 0 12px"}}>Your Table Is Ready</h2>
          <p className="lead">Thank you for choosing AURELIA{order.name?`, ${order.name}`:""}.</p>
          <div style={{display:"flex",justifyContent:"center",gap:34,flexWrap:"wrap",margin:"26px 0"}}>
            <div><b style={{fontFamily:"var(--serif)",fontSize:"1.3rem",display:"block"}}>{order.id}</b><span style={{fontSize:".82rem",color:"var(--ink-soft)"}}>Order Number</span></div>
            <div><b style={{fontFamily:"var(--serif)",fontSize:"1.3rem",display:"block"}}>25–35 min</b><span style={{fontSize:".82rem",color:"var(--ink-soft)"}}>Estimated Prep</span></div>
            <div><b style={{fontFamily:"var(--serif)",fontSize:"1.3rem",display:"block"}}>{rupee(order.total)}</b><span style={{fontSize:".82rem",color:"var(--ink-soft)"}}>Paid · {order.mode}</span></div>
          </div>
          <button className="btn btn-primary" onClick={()=>{setView("home");window.scrollTo({top:0});}}>Continue Exploring</button>
        </div>
      </div>
    </section>
  );
}

  return (
    <footer className="footer">
      <div className="container">
        <div className="footer-grid">
          <div>
            <div className="foot-brand">AURELIA</div>
            <p style={{fontFamily:"var(--serif-alt)",fontStyle:"italic",fontSize:"1.05rem"}}>Where Every Plate Tells a Story.</p>
            <div className="social">
              <a href="#" onClick={e=>{e.preventDefault();toast("Instagram");}} aria-label="Instagram"><Icon name="insta" size={18}/></a>
              <a href="mailto:hello@aureliarestaurant.com" aria-label="Email"><Icon name="mail" size={18}/></a>
              <a href="tel:+919000000000" aria-label="Phone"><Icon name="phone" size={18}/></a>

function ToastHost(){
  const {toasts}=useStore();
  return (<div className="toast-wrap" aria-live="polite">{toasts.map(t=><div key={t.id} className="toast"><Icon name="check" size={16}/> {t.msg}</div>)}</div>);
}

function Home(){

  return (

function App(){
  const {view}=useStore();
  useEffect(()=>{ window.scrollTo({top:0}); },[view]);
  return (
    <>
      <Particles/>
      <Navbar/>
      {view==="home" && <Home/>}
      {view==="checkout" && <Checkout/>}
      {view==="confirmed" && <OrderConfirmation/>}
      <Footer/>
      <CartDrawer/>
      <FoodDetailModal/>
      <ToastHost/>
      <FlyLayer/>

}

ReactDOM.createRoot(document.getElementById("root")).render(<StoreProvider><App/></StoreProvider>);
